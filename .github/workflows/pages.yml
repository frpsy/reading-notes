name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: e2e 스모크 테스트
        env:
          DESIGN_SCREENSHOT_DIR: design-screenshots
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-screenshots
          path: design-screenshots/
          retention-days: 7

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Firestore 규칙 에뮬레이터 테스트(운영 프로젝트 미접속)
        run: |
          npm i --no-save firebase-tools@15.34.2 @firebase/rules-unit-testing@6.0.0 firebase@13
          PATH="$PWD/node_modules/.bin:$PATH" npm run test:rules

  deploy:
    if: github.event_name != 'pull_request'
    needs: [test, rules]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest .nojekyll css js catalog icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
